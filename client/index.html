<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>CareLink · Healthcare Appointment Portal</title>
    <meta name="description" content="Find doctors, book appointments and manage your health profile with an AI scheduling assistant." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CareLink · Healthcare Appointment Portal" />
    <meta property="og:description" content="Find doctors, book appointments and manage your health profile with an AI scheduling assistant." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('hc_theme');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
