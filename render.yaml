services:
  - type: web
    name: carelink-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
